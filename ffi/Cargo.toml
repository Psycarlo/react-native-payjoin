[package]
name = "payjoin-rn-ffi"
version = "0.1.0"
edition = "2021"
license = "MIT"

# The cdylib produced here is the single native library loaded by the
# TurboModule. The uniffi scaffolding it contains comes from `payjoin-ffi`
# (namespace "payjoin"), which we re-export wholesale.
[lib]
name = "payjoin_ffi"
crate-type = ["cdylib", "staticlib", "lib"]
doctest = false

[dependencies]
# Upstream uniffi wrapper around the payjoin crate. This is the entire
# generated API surface: send/receive typestates, Uri/PjUri, OhttpKeys,
# and the persister callback interfaces.
#
# NOTE: payjoin-ffi is NOT published to crates.io; upstream ships it only as
# the source of the Python / JavaScript / C# / Dart packages. So we pin an
# exact commit for reproducibility. This rev is the `payjoin-ffi-0.25.0`
# release tag, where payjoin-ffi declares `payjoin = "1.2.0"`.
payjoin-ffi = { git = "https://github.com/payjoin/rust-payjoin.git", rev = "13f9f82acfa7f38a00a801617a8e462eac08510c" }

# The `io` feature adds fetch_ohttp_keys(), which needs an HTTP CONNECT
# proxy to keep the client IP off the payjoin directory. RN's fetch/XHR
# cannot do CONNECT, so this must live on the Rust side.
#
# Taken from crates.io. Through the release candidates payjoin-ffi was
# developed against an in-tree `payjoin` that had no published counterpart, so
# this had to be git-pinned and redirected with a `[patch.crates-io]` to keep
# wrapper and core on one crate instance. `payjoin 1.2.0` is published and is
# exactly what payjoin-ffi asks for at the pinned rev, so both now resolve to
# the same crates.io release with no patch.
payjoin = { version = "1.2.0", features = ["v1", "v2", "io"] }

# Must match the uniffi version used by payjoin-ffi 0.25.0.
uniffi = { version = "=0.31.2", features = ["tokio"] }

# The offline (out-of-band) receiver primitives in `manual.rs` build PSBTs and
# input pairs directly, so they need the same `bitcoin` types the pinned
# `payjoin` core exposes — a different major here would be a distinct crate
# instance and the types would not unify. `payjoin 1.1.0` raised its floor to
# 0.32.102, so this matches it.
bitcoin = { version = "0.32.102", features = ["base64", "serde"] }

# `ProvisionalProposal` is Serialize/Deserialize, which is what makes the
# two-step offline flow resumable across the signing step.
base64 = "0.22"
serde_json = "1"

# fetch_ohttp_keys is async over reqwest; uniffi polls Rust futures without
# entering a Tokio context, so we own a runtime to spawn onto.
tokio = { version = "1", features = ["rt-multi-thread"] }
thiserror = "2"

# Size over speed: this cdylib ships inside a mobile app, once per ABI, and
# payjoin does no hot-loop crypto — the win from fat LTO + opt-level "z" is
# several MB per ABI. `panic` stays "unwind" (the default): uniffi scaffolding
# catches Rust panics at the FFI boundary, and "abort" would turn them into
# process crashes.
[profile.release]
lto = true
codegen-units = 1
opt-level = "z"
strip = "debuginfo"
