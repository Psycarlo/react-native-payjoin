[package]
name = "payjoin-rn-ffi"
version = "0.1.0"
edition = "2021"
license = "MIT"

# The cdylib produced here is the single native library loaded by the
# TurboModule. The uniffi scaffolding it contains comes from `payjoin-ffi`
# (namespace "payjoin"), which we re-export wholesale.
[lib]
name = "payjoin_ffi"
crate-type = ["cdylib", "staticlib", "lib"]
doctest = false

[dependencies]
# Upstream uniffi wrapper around the payjoin crate. This is the entire
# generated API surface: send/receive typestates, Uri/PjUri, OhttpKeys,
# and the persister callback interfaces.
#
# NOTE: payjoin-ffi is NOT published to crates.io (its 0.24.0 version is
# internal to the monorepo), and it exists only on `master` — no release tag
# contains it. So we pin an exact commit for reproducibility.
payjoin-ffi = { git = "https://github.com/payjoin/rust-payjoin.git", rev = "c23380a4fa01765e11efafff121bfefac7ec9449" }

# The `io` feature adds fetch_ohttp_keys(), which needs an HTTP CONNECT
# proxy to keep the client IP off the payjoin directory. RN's fetch/XHR
# cannot do CONNECT, so this must live on the Rust side.
#
# Pinned to the same git rev as payjoin-ffi, not crates.io. payjoin-ffi
# declares `payjoin = "1.0.0-rc.6"` but is developed against the in-tree
# `payjoin` via the workspace's `[patch.crates-io]`. As an external consumer
# we do not inherit that patch, so taking rc.6 from crates.io pairs the
# wrapper with a core that predates its own API changes and fails to build.
# See the [patch.crates-io] section below, which unifies both on one source.
payjoin = { git = "https://github.com/payjoin/rust-payjoin.git", rev = "c23380a4fa01765e11efafff121bfefac7ec9449", features = ["v1", "v2", "io"] }

# Must match the uniffi version used by payjoin-ffi 0.24.0.
uniffi = { version = "=0.31.2", features = ["tokio"] }

# fetch_ohttp_keys is async over reqwest; uniffi polls Rust futures without
# entering a Tokio context, so we own a runtime to spawn onto.
tokio = { version = "1", features = ["rt-multi-thread"] }
thiserror = "2"

# Size over speed: this cdylib ships inside a mobile app, once per ABI, and
# payjoin does no hot-loop crypto — the win from fat LTO + opt-level "z" is
# several MB per ABI. `panic` stays "unwind" (the default): uniffi scaffolding
# catches Rust panics at the FFI boundary, and "abort" would turn them into
# process crashes.
[profile.release]
lto = true
codegen-units = 1
opt-level = "z"
strip = "debuginfo"

# payjoin-ffi depends on `payjoin` by version from crates.io. Redirect that to
# the git rev above so the wrapper and the core it was written against resolve
# to a single crate instance — mirroring the monorepo's own [patch.crates-io].
[patch.crates-io]
payjoin = { git = "https://github.com/payjoin/rust-payjoin.git", rev = "c23380a4fa01765e11efafff121bfefac7ec9449" }
