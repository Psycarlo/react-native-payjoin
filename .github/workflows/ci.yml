name: CI

# Actions are pinned to commit SHAs (tag in the trailing comment): this repo
# ships prebuilt binaries that handle bitcoin, so a hijacked action tag must
# not be able to inject into the build.

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  rust-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          cache-workspaces: ffi

      - name: Check formatting
        working-directory: ffi
        run: cargo fmt --check

      - name: Build FFI shim
        working-directory: ffi
        run: cargo build --lib

      - name: Clippy
        working-directory: ffi
        run: cargo clippy --all-targets -- -D warnings

      - name: Run Rust tests
        working-directory: ffi
        run: cargo test

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: TypeScript typecheck
        run: pnpm typecheck

      - name: Run JS tests
        run: pnpm test

  cargo-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Audit Rust dependencies
        working-directory: ffi
        run: cargo audit
